name: Barry
options:
  bundleIdPrefix: rocks.barry
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
targets:
  Barry:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Barry
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # The device path is real HTTPS with a real Let's Encrypt certificate,
        # so no ATS exception is needed for it. The one remaining plain-HTTP
        # caller is the SIMULATOR, which talks to the proxy on 127.0.0.1:9429 —
        # `NSAllowsLocalNetworking` permits exactly that and nothing routable.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: MarkdownUI
  BarryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Barry
  BarryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Barry
schemes:
  Barry:
    build:
      targets:
        Barry: all
        BarryTests: [test]
        BarryUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BarryTests
        - BarryUITests
